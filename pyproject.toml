[project]
name = "semdrift"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# The extractor is frozen by research/03-dataset/protected_files.json.
extend-exclude = [
    "src/semdrift/extract_tools.py",
]
include = ["src/semdrift/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I"]
