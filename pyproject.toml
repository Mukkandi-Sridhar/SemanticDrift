[project]
name = "semdrift"
version = "0.2.0"
description = "Does rewording MCP tool descriptions change which agent looks best? Data, harness and results."
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [{ name = "Mukkandi Sridhar" }]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.10"]

[project.urls]
Repository = "https://github.com/Mukkandi-Sridhar/SemanticDrift"

[tool.ruff]
line-length = 100
target-version = "py311"
# The extractor is frozen by research/03-dataset/protected_files.json.
extend-exclude = [
    "src/semdrift/extract_tools.py",
]
include = ["src/semdrift/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I"]
