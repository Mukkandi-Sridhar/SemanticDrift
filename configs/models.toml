#   OpenAI model pages (2026-11-25): luna/terra accept "none"; gpt-6.2-sol rejects "none" -> "low".
#   OpenRouter /api/v1/models `reasoning` metadata (2026-11-25): Sonnet 5.5 and Gemini 4 Carbon are
